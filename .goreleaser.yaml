version: 2

project_name: passmcp-lsp

release:
  # Named rather than read from the git remote, so `goreleaser check`
  # passes in a checkout that has none.
  github:
    owner: sebastienrousseau
    name: passmcp-lsp
  # Replace an existing GitHub release on re-run, so a release can be
  # retried after fixing a publishing problem.
  mode: replace
  # The page's notes are not goreleaser's: the release workflow's last
  # step (scripts/releasepage) rewrites the title and body in the family
  # layout once every asset is attached, so the changelog is disabled
  # below rather than published and overwritten. The title is set here
  # too, so the page is named right from its first second.
  name_template: "{{ .ProjectName }} {{ .Version }}"
  # The VS Code extension, built by `make vscode` in the Release workflow
  # before goreleaser runs. It is attached to the release and listed in
  # checksums.txt with the archives; publishing it to a marketplace is a
  # separate, manual step.
  extra_files:
    - glob: editors/vscode/passmcp-lsp.vsix
      name_template: "passmcp-lsp-{{ .Version }}.vsix"
builds:
  - env:
      - CGO_ENABLED=0
    # -trimpath removes the build machine's absolute paths from the binary,
    # and the pinned timestamp makes two builds of the same commit
    # byte-identical, which is what lets a third party check provenance
    # rather than trust it.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    main: ./cmd/passmcp-lsp
    binary: passmcp-lsp
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - SECURITY.md
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: 'checksums.txt'
  extra_files:
    - glob: editors/vscode/passmcp-lsp.vsix
      name_template: "passmcp-lsp-{{ .Version }}.vsix"

# Keyless cosign signature over checksums.txt as a Sigstore bundle. Verify:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp 'https://github.com/sebastienrousseau/passmcp-lsp/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - cmd: cosign
    signature: '${artifact}.sigstore.json'
    args:
      - sign-blob
      - '--bundle=${signature}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true
