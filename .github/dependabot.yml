version: 2
updates:
  # One direct dependency, passmcp-reporting, which moves in lockstep with
  # passmcp; this also keeps the toolchain directive current.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
  # The VS Code extension's client library and build tools.
  - package-ecosystem: "npm"
    directory: "/editors/vscode"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      vscode-extension:
        patterns:
          - "*"
    # @types/vscode is held at the engines.vscode floor in package.json:
    # vsce refuses to package types newer than the oldest VS Code the
    # extension supports. It moves with engines.vscode, by hand.
    ignore:
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
