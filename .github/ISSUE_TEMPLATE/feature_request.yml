name: Feature request
description: A file the server should check, a diagnostic it should give, or an editor it should support.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: An example
      description: A file, and the diagnostic or hover you would expect on it.
