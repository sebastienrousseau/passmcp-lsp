name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    name: Test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["go.mod", "stable"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        if: matrix.go == 'go.mod'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up latest stable Go
        if: matrix.go == 'stable'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # internal/guidance's exec tests are //go:build !windows: they stand a
      # shell script in for passmcp. On Windows the rest of the package is
      # tested and those are not.
      - name: Test
        run: go test ./... -cover

  race:
    name: Race & Shuffled Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Race detector, randomised order
        env:
          GOTOOLCHAIN: auto
        run: go test -race -shuffle=on -count=1 ./...

  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every package at or above 85% statement coverage
        env:
          GOTOOLCHAIN: auto
          THRESHOLD: '85'
        run: |
          set -euo pipefail
          go test -count=1 -coverprofile=coverage.out ./... 2>&1 | tee coverage.log
          failed=0
          # "ok  <pkg>  <time>  coverage: NN.N% of statements"
          while read -r line; do
            pkg="$(echo "${line}" | awk '{print $2}')"
            pct="$(echo "${line}" | grep -oE 'coverage: [0-9.]+%' | grep -oE '[0-9.]+' || true)"
            [ -z "${pct}" ] && continue
            if awk -v p="${pct}" -v t="${THRESHOLD}" 'BEGIN { exit !(p < t) }'; then
              echo "::error::${pkg} is at ${pct}%, below the ${THRESHOLD}% gate"
              failed=1
            else
              echo "${pkg}: ${pct}%"
            fi
          done < <(grep -E '^ok .*coverage:' coverage.log || true)
          exit "${failed}"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Formatting is canonical
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "::error::gofmt would change:"; echo "${unformatted}"; exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: auto
        with:
          version: v2.13.2
          args: ./...

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The JSON-RPC framing and the JSON parser, 30 seconds each
        env:
          GOTOOLCHAIN: auto
        run: make fuzz FUZZTIME=30s

  vulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: govulncheck
        env:
          GOTOOLCHAIN: auto
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The policy rules and the hover against passmcp at the version this
  # repository is in lockstep with: passmcp must refuse exactly the policy
  # fixtures this repository reports errors in, and explain must still give
  # guidance in the shape hover reads.
  crosscheck:
    name: Crosscheck with passmcp
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build passmcp at the lockstep version
        run: |
          set -euo pipefail
          ver="$(grep -Eo '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -1 | tr -d '#[] ')"
          go install "satellion.com/passmcp/cmd/passmcp@v${ver}"
      - name: Policies and hover agree with passmcp
        run: make crosscheck PASSMCP="$(go env GOPATH)/bin/passmcp"

  checks:
    name: Repository Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The built server answers over stdio
        env:
          GOTOOLCHAIN: auto
        run: make smoke
      - name: Shell completions generate and parse
        env:
          GOTOOLCHAIN: auto
        run: make completions
      # GNUmakefile's install contract: every file lands under PREFIX in a
      # staged DESTDIR, the binary runs, and uninstall leaves nothing.
      - name: make install under DESTDIR produces a correct tree
        env:
          GOTOOLCHAIN: auto
        run: make install-smoke
      - name: Every version-bearing file names the newest release
        run: make versions
      - name: The embedded server.json schema is the published one
        env:
          GOTOOLCHAIN: auto
        run: make schema-check
      - name: This repository's row in the family manifest is true
        run: make family
      - name: Version Lockstep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make lockstep

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install from the lock, test, and package the .vsix
        run: make vscode
      - name: Keep the .vsix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: passmcp-lsp-vsix
          path: editors/vscode/passmcp-lsp.vsix
          if-no-files-found: error
          retention-days: 14
