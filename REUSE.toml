# SPDX-FileCopyrightText: 2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>
# SPDX-License-Identifier: Apache-2.0
#
# Machine-readable licensing, per the REUSE specification. Every source file
# carries an SPDX header and scripts/spdx_sweep.go fails the build when one
# does not; this file covers what a header cannot.

version = 1
SPDX-PackageName = "passmcp-lsp"
SPDX-PackageSupplier = "Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/sebastienrousseau/passmcp-lsp"

# The MCP Registry's server.json schema, embedded byte for byte from
# https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json
# (make schema-check compares it with the published copy, so it cannot
# carry a header). Its upstream, github.com/modelcontextprotocol/registry,
# states that the project is moving from MIT to Apache-2.0: new and
# relicensed contributions are Apache-2.0, the rest remain MIT, so the file
# is recorded under both.
[[annotations]]
path = ["internal/check/schemas/server.schema.json"]
precedence = "override"
SPDX-FileCopyrightText = "The MCP Registry contributors <https://github.com/modelcontextprotocol/registry>"
SPDX-License-Identifier = "Apache-2.0 AND MIT"

# Test fixtures and benchmark inputs: JSON, which takes no comments.
[[annotations]]
path = ["**/testdata/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

# Go module metadata, repository configuration and the VS Code extension's
# manifests: formats that take no comments.
[[annotations]]
path = [
  "go.mod",
  "go.sum",
  ".gitignore",
  ".gitattributes",
  ".github/CODEOWNERS",
  "editors/vscode/package.json",
  "editors/vscode/package-lock.json",
  "editors/vscode/tsconfig.json",
  "editors/vscode/.vscodeignore",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

# Generated by pip-compile, which rewrites the whole file: the manual's
# hash-locked build requirements.
[[annotations]]
path = ["docs/requirements.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"
