site_name: passmcp-lsp
site_description: A language server for MCP artefacts, with passmcp's guidance on hover.
site_url: https://sebastienrousseau.com/passmcp-lsp/
repo_url: https://github.com/sebastienrousseau/passmcp-lsp
repo_name: sebastienrousseau/passmcp-lsp
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: public
strict: true
exclude_docs: |
  requirements.in
  requirements.txt
  releases/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Diagnostics: diagnostics.md
  - Editors: editors.md
  - Architecture: ARCHITECTURE.md
  - Comparison: COMPARISON.md
  - Benchmarks: BENCHMARKS.md
  - Decision records:
      - adr/README.md
      - adr/0001-ask-passmcp-for-guidance.md
      - adr/0002-own-parser-and-schema-subset.md
      - adr/0003-attestations-verified-by-passmcp-reporting.md
      - adr/0004-silent-on-unrecognised-json.md
      - adr/0005-version-in-lockstep-with-passmcp.md
